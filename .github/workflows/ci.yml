name: MSG50 Backend CI Pipeline

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Run Ruff Linting Check
      run: |
        ruff check .

    - name: Validate OpenAPI Swagger Schema
      env:
        USE_SQLITE: "True"
        REDIS_URL: "redis://localhost:6379/0"
        SECRET_KEY: "ci-secret-key-for-testing"
      run: |
        python manage.py spectacular --validate

    - name: Run Django Test Suite
      env:
        USE_SQLITE: "True"
        REDIS_URL: "redis://localhost:6379/0"
        SECRET_KEY: "ci-secret-key-for-testing"
      run: |
        python manage.py test
